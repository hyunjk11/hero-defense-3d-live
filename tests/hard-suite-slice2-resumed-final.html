<button id="run">Run isolated suite</button><pre id="status">Idle — fixtures, accelerated engine, no real accounts</pre><iframe id="game" width="1280" height="720"></iframe>
<script type="module">
const status=document.querySelector('#status'),frame=document.querySelector('#game');
const cases=[{"profile": "advanced-mage-10", "stage": "hard-2-1", "strategy": "spread", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-2-2", "strategy": "mixed", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-2-3", "strategy": "cluster", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-2-5", "strategy": "mixed", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-2-6", "strategy": "cluster", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-2-4", "strategy": "control", "seed": 54321}, {"profile": "advanced-mage-10", "stage": "hard-3-1", "strategy": "spread", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-3-2", "strategy": "mixed", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-3-3", "strategy": "control", "seed": 54321}, {"profile": "advanced-mage-10", "stage": "hard-3-5", "strategy": "mixed", "seed": 12345}, {"profile": "advanced-mage-10", "stage": "hard-3-6", "strategy": "defend", "seed": 12345}, {"profile": "advanced-warrior-10", "stage": "hard-3-4", "strategy": "mobile", "seed": 12345}, {"profile": "advanced-warrior-10", "stage": "10-6", "strategy": "mobile", "seed": 12345}, {"profile": "advanced-warrior-10", "stage": "hard-1-6", "strategy": "mobile", "seed": 12345}, {"profile": "advanced-warrior-10", "stage": "hard-2-1", "strategy": "mobile", "seed": 12345}, {"profile": "advanced-warrior-10", "stage": "hard-3-1", "strategy": "mobile", "seed": 12345}, {"profile": "advanced-archer-10", "branch": "hawk", "stage": "hard-2-1", "strategy": "cluster", "seed": 23456, "level": 50, "choice": 1}, {"profile": "advanced-mage-10", "branch": "flame", "stage": "hard-2-1", "strategy": "cluster", "seed": 23456, "level": 50, "choice": 1}, {"profile": "advanced-warrior-10", "branch": "berserk", "stage": "hard-2-1", "strategy": "mobile", "seed": 23456, "level": 50, "choice": 1}, {"profile": "advanced-gunner-10", "branch": "thorn", "stage": "hard-2-1", "strategy": "cluster", "seed": 23456, "level": 50, "choice": 1}, {"profile": "advanced-fighter-10", "branch": "dragon", "stage": "hard-2-1", "strategy": "mobile", "seed": 23456, "level": 50, "choice": 1}];
window.qaResults=[];window.qaProgress=s=>status.textContent=JSON.stringify({case:window.qaCurrent,wave:s.wave,phase:s.phase,core:s.core,done:qaResults.length});
const delay=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;for(let i=0;i<cases.length;i++){
 const c={...cases[i],device:'slice2-resumed-final-'+i};window.qaCurrent=c;let started=performance.now();
 try{const f=await fetch('/__scenario',{method:'POST',body:JSON.stringify(c)}).then(r=>r.json());if(!f.ok)throw Error('fixture failed');frame.src='/?qa='+c.device+'&stage='+c.stage+'&run=1&rng='+c.seed;
 let ready=false;for(let j=0;j<200;j++){await delay(100);if(frame.contentWindow.G?.phase==='build'&&frame.contentWindow.G?.hero){ready=true;break;}}if(!ready)throw Error('load timeout');
 frame.contentWindow.settlementGrowth=frame.contentWindow.hardGrowth;const result=await frame.contentWindow.hardDriver.run({settle:true});await delay(600);
 const hg=await frame.contentWindow.settlementGrowth;for(let n=0;n<200&&hg.HG.pending;n++)await delay(100);const evidence=await fetch('/__evidence').then(r=>r.json());qaResults.push({case:c,result,evidence,pending:hg.HG.pending,realMs:performance.now()-started,errors:frame.contentWindow.__isolatedReview?.errors});
 }catch(e){qaResults.push({case:c,error:String(e),partial:frame.contentWindow.hardDriver?.result(),errors:frame.contentWindow.__isolatedReview?.errors,realMs:performance.now()-started});}
 await fetch('/__result',{method:'POST',body:JSON.stringify(qaResults.at(-1))});
 status.textContent=JSON.stringify({done:qaResults.length,last:qaResults.at(-1)?.result?.core,error:qaResults.at(-1)?.error});
 }window.qaDone=true;status.textContent='Completed '+qaResults.length;};
</script>
