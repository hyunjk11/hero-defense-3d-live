<!doctype html><meta charset="utf-8"><title>RAM hard/tree battle suite</title>
<button id="run">Run isolated suite</button><pre id="status">Idle — fixtures, accelerated engine, no real accounts</pre><iframe id="game" width="1280" height="720"></iframe>
<script type="module">
const status=document.querySelector('#status'),frame=document.querySelector('#game');
const cases=[{"profile": "advanced-warrior-10", "stage": "hard-4-3", "strategy": "tactical", "seed": 12345}, {"profile": "advanced-warrior-10", "stage": "hard-4-3", "strategy": "tactical", "seed": 54321}, {"profile": "advanced-fighter-10", "stage": "hard-4-3", "strategy": "tactical", "seed": 12345, "branch": "dragon", "purchaseBranch": true}, {"profile": "advanced-fighter-10", "stage": "hard-4-3", "strategy": "tactical", "seed": 54321, "branch": "dragon", "purchaseBranch": true}];
const sourcePaths=["src/render/vfx.js", "tests/hard45-balance-driver.mjs", "src/core/waves.js", "src/data/hard.js", "src/data/skill-tree.js", "src/data/stages.js", "src/heroes/advfx.js", "src/heroes/fighter.js", "src/heroes/gunner.js", "src/heroes/hero.js", "src/heroes/legend.js", "src/heroes/skills.js", "src/monsters/hard.js", "src/ui/skill-tree.js", "src/ui/stagesel.js", "src/combat/projectiles.js"];
const sourceHashes=async()=>Object.fromEntries(await Promise.all(sourcePaths.map(async p=>[p,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await fetch('/'+p).then(r=>r.arrayBuffer()))),x=>x.toString(16).padStart(2,'0')).join('')])));
window.qaResults=[];window.qaProgress=s=>status.textContent=JSON.stringify({case:window.qaCurrent,wave:s.wave,phase:s.phase,core:s.core,done:qaResults.length});
const delay=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;for(let i=0;i<cases.length;i++){
 const c={...cases[i],device:'slice3-melee-tactics-'+i};window.qaCurrent=c;let started=performance.now();const servedSourceHashesAtStart=await sourceHashes();
 try{const f=await fetch('/__scenario',{method:'POST',body:JSON.stringify(c)}).then(r=>r.json());if(!f.ok)throw Error('fixture failed');frame.src='/?qa='+c.device+'&stage='+c.stage+'&run=1&rng='+c.seed;
 let ready=false;for(let j=0;j<200;j++){await delay(100);if(frame.contentWindow.G?.phase==='build'&&frame.contentWindow.G?.hero){ready=true;break;}}if(!ready)throw Error('load timeout');
 await new Promise((resolve,reject)=>{const script=frame.contentDocument.createElement('script');script.type='module';script.src='/tests/hard45-driver-init.mjs';script.onload=resolve;script.onerror=reject;frame.contentDocument.head.append(script);});if(c.noEquipmentProc)frame.contentWindow.G.hero.lsk=null;frame.contentWindow.settlementGrowth=frame.contentWindow.hardGrowth;const result=await frame.contentWindow.hardDriver.run({settle:true});await delay(600);
 const hg=await frame.contentWindow.settlementGrowth;for(let n=0;n<200&&hg.HG.pending;n++)await delay(100);const evidence=await fetch('/__evidence').then(r=>r.json());qaResults.push({case:c,result,evidence,servedSourceHashesAtStart,pending:hg.HG.pending,realMs:performance.now()-started,errors:frame.contentWindow.__isolatedReview?.errors});
 }catch(e){qaResults.push({case:c,error:String(e),partial:frame.contentWindow.hardDriver?.result(),errors:frame.contentWindow.__isolatedReview?.errors,realMs:performance.now()-started});}
 await fetch('/__result',{method:'POST',body:JSON.stringify(qaResults.at(-1))});
 status.textContent=JSON.stringify({done:qaResults.length,last:qaResults.at(-1)?.result?.core,error:qaResults.at(-1)?.error});
 }window.qaDone=true;status.textContent='Completed '+qaResults.length;};
</script>
