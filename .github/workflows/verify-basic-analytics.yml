name: Verify production analytics deployment
on:
  push:
    branches:
      - verify/basic-analytics-20261116
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check production HTML and exact verified analytics source
        run: node tests/analytics-deployment-verification.mjs
